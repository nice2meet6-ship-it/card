<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>김요안 | 민음사 출판 그룹</title>
<meta name="description" content="민음사 출판 그룹 마케팅부 부장 김요안의 디지털 명함">
<meta property="og:title" content="김요안 | 민음사 출판 그룹">
<meta property="og:description" content="마케팅부 부장 · 연락처를 바로 저장하세요">
<meta property="og:image" content="https://nice2meet6-ship-it.github.io/card/card-front.png?v=fe6edd18">
<meta property="og:type" content="profile">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📗</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{ --accent:#323e67; --paper:#faf8f3; --ink:#1c1e1c; --sub:#6e706e; --hair:#e4e1d9; }
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#e9e6de; font-family:'Noto Sans KR',sans-serif; color:var(--ink);
  display:flex; justify-content:center;
}
.sheet{
  background:var(--paper); width:100%; max-width:430px; min-height:100vh;
  box-shadow:0 0 44px rgba(0,0,0,.09);
}
/* 명함 이미지 — 좌우 여백 없이 꽉 차게 */
.face{display:block; width:100%; height:auto}

.pad{padding:22px 26px 28px}
.save{
  display:block; background:var(--accent); color:#fff;
  text-align:center; text-decoration:none; font-size:18px; font-weight:500;
  letter-spacing:.04em; padding:18px 0; border-radius:13px;
}
.save:active{opacity:.85}
.hint{text-align:center; font-size:13px; color:var(--sub); margin-top:11px}
.quick{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-top:16px}
.quick a{
  border:1.5px solid var(--accent); color:var(--accent); text-decoration:none;
  text-align:center; padding:12px 0; border-radius:11px; font-size:15px; font-weight:500;
}
.quick a:active{background:rgba(50,62,103,.08)}
.dl{
  display:flex; gap:10px; justify-content:center;
  padding:20px 26px 34px; border-top:1px solid var(--hair);
}
.dl a{
  color:var(--sub); text-decoration:none; font-size:13.5px;
  border:1px solid var(--hair); border-radius:9px; padding:9px 15px;
}
.dl a:active{background:#f1eee6}
</style>
</head>
<body>
<main class="sheet">
  <img class="face" src="card-front.png?v=fe6edd18" width="1182" height="1940"
       alt="김요안 명함 앞면 — 민음사 출판 그룹 마케팅부">

  <div class="pad">
    <a class="save" href="kimyoan.vcf" download="김요안_민음사.vcf">📇 연락처 저장하기</a>
    <p class="hint">버튼을 누르면 연락처에 바로 추가됩니다</p>
    <div class="quick">
      <a href="tel:010-9434-2269">전화</a>
      <a href="sms:010-9434-2269">문자</a>
      <a href="mailto:nice2meet6@minumsa.com">메일</a>
    </div>
  </div>

  <img class="face" src="card-back.png?v=3c275898" width="1182" height="1940"
       alt="김요안 명함 뒷면 — 주소·전화·이메일과 연락처 저장용 QR">

  <div class="dl">
    <a href="card-front.png?v=fe6edd18" download="김요안_명함_앞.png">앞면 이미지 저장</a>
    <a href="card-back.png?v=3c275898" download="김요안_명함_뒤.png">뒷면 이미지 저장</a>
  </div>
</main>
</body>
</html>
